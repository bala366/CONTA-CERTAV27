name: Compilar APK Conta Certa V027

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle clean :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p apk-final
          cp app/build/outputs/apk/debug/*.apk apk-final/Conta_Certa_V027.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conta_Certa_V027_APK
          path: apk-final/Conta_Certa_V027.apk
          if-no-files-found: error
